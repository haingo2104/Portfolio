<header class="navbar" [class.scrolled]="scrolled()">
  <a routerLink="/" class="navbar__logo" (click)="closeMenu()">
    <span class="navbar__logo-dot"></span>
    <span class="navbar__logo-text">haingo<span class="accent">.dev</span></span>
  </a>

  <nav class="navbar__nav" [class.open]="menuOpen()">
    <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()"><span>Profil</span></a>
    <a routerLink="/skills" routerLinkActive="active" (click)="closeMenu()"><span>Compétences</span></a>
    <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()"><span>Projets</span></a>

    <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()"><span>Contact</span></a>
    <a
      href="cv-haingo-nirina-fara-mampionona.pdf"
      download="CV-Haingo-Nirina-Fara-Mampionona.pdf"
      class="navbar__nav-cv"
    >
      <span>Télécharger mon CV</span>
    </a>
  </nav>

  <div class="navbar__actions">
    <a
      href="cv-haingo-nirina-fara-mampionona.pdf"

    </a>
  </div>

  <button class="navbar__burger" aria-label="Menu" (click)="toggleMenu()">

  </button>
